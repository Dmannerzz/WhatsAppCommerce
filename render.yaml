services:
  - type: web
    name: whatsapp-commerce-backend
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: BRIDGE_API_URL="http://${BRIDGE_HOSTPORT}" MEDIA_DIR=/var/data/media uv run uvicorn whatsapp_agent.app:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    disk:
      name: backend-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-commerce-db
          property: connectionString
      - key: BRIDGE_HOSTPORT
        fromService:
          type: pserv
          name: whatsapp-commerce-bridge
          property: hostport
      - key: ADMIN_USERNAME
        value: mum
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BRIDGE_API_SECRET
        sync: false
      - key: BRIDGE_WEBHOOK_SECRET
        sync: false
      - key: MARKUP_RULE
        value: "2500"
      - key: MIN_PROFIT_RULE
        value: "500"

  - type: pserv
    name: whatsapp-commerce-bridge
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: whatsapp-bridge
    buildCommand: npm ci && npm run build
    startCommand: BACKEND_WEBHOOK_URL="http://${BACKEND_HOSTPORT}/api/webhooks" npm start
    disk:
      name: whatsapp-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: whatsapp-commerce-backend
          property: hostport
      - key: BRIDGE_API_HOST
        value: 0.0.0.0
      - key: BRIDGE_API_PORT
        value: "3001"
      - key: WHATSAPP_AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: BRIDGE_API_SECRET
        sync: false
      - key: BRIDGE_WEBHOOK_SECRET
        sync: false

databases:
  - name: whatsapp-commerce-db
    databaseName: whatsapp_commerce
    user: whatsapp_commerce
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "17"
    diskSizeGB: 15
